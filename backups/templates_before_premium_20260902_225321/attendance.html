
<style>
.admin-actions{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
}
.admin-edit-btn,
.admin-delete-btn{
    display:inline-block;
    padding:8px 13px;
    border-radius:9px;
    text-decoration:none;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}
.admin-edit-btn{
    background:#d4a72c;
    color:#fff !important;
    border:1px solid #c29418;
}
.admin-edit-btn:hover{
    background:#b8860b;
}
.admin-delete-btn{
    background:#fff5f5;
    color:#b42318;
    border:1px solid #f0b7b2;
}
.admin-delete-btn:hover{
    background:#ffe8e6;
}
.admin-delete-form{
    display:inline;
    margin:0;
}
</style>
<script>
function confirmDelete(name){
    return confirm("Are you sure you want to delete " + name + "? This action cannot be undone.");
}
</script>

{% extends "base.html" %}
{% block content %}

<h1>Attendance</h1>

<div class="card">

<form method="get" class="search">

<input
type="date"
name="date"
value="{{selected_date}}"
>

<button class="btn">
LOAD
</button>

</form>

</div>

<div class="card tablewrap">

<form method="post">

<input
type="hidden"
name="date"
value="{{selected_date}}"
>

<table>

<tr>
<th>Student</th>
<th>Class</th>
<th>Batch</th>
<th>Status</th>
</tr>

{% for s in students %}

<tr>

<td>
{{s.name}} ({{s.student_id}})
</td>

<td>{{s.class_name}}</td>

<td>{{s.batch}}</td>

<td>

<select name="status_{{s.id}}">

<option
{% if s.status=="Present" %}
selected
{% endif %}
>
Present
</option>

<option
{% if s.status=="Absent" %}
selected
{% endif %}
>
Absent
</option>

</select>

</td>

</tr>

{% endfor %}

</table>

<br>

<button class="btn primary">
SAVE ATTENDANCE
</button>

</form>

</div>

{% endblock %}
