
<style>
.admin-actions{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
}
.admin-edit-btn,
.admin-delete-btn{
    display:inline-block;
    padding:8px 13px;
    border-radius:9px;
    text-decoration:none;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}
.admin-edit-btn{
    background:#d4a72c;
    color:#fff !important;
    border:1px solid #c29418;
}
.admin-edit-btn:hover{
    background:#b8860b;
}
.admin-delete-btn{
    background:#fff5f5;
    color:#b42318;
    border:1px solid #f0b7b2;
}
.admin-delete-btn:hover{
    background:#ffe8e6;
}
.admin-delete-form{
    display:inline;
    margin:0;
}
</style>
<script>
function confirmDelete(name){
    return confirm("Are you sure you want to delete " + name + "? This action cannot be undone.");
}
</script>

{% extends "base.html" %}
{% block content %}

<h1>Finance</h1>

<div class="stats">

<div class="stat">
<small>INCOME</small>
<strong>৳{{income}}</strong>
</div>

<div class="stat">
<small>EXPENSE</small>
<strong>৳{{expense}}</strong>
</div>

<div class="stat">
<small>BALANCE</small>
<strong>৳{{income-expense}}</strong>
</div>

</div>

<div class="card">

<form method="post" class="grid">

<input
type="date"
name="tx_date"
required
>

<select name="tx_type">

<option>Income</option>
<option>Expense</option>

</select>

<input
name="category"
placeholder="Category"
>

<input
name="amount"
type="number"
step="0.01"
placeholder="Amount"
required
>

<input
name="note"
placeholder="Note"
>

<button class="btn primary">
SAVE TRANSACTION
</button>

</form>

</div>

<div class="card tablewrap">

<table>

<tr>
<th>Date</th>
<th>Type</th>
<th>Category</th>
<th>Amount</th>
<th>Action</th>
</tr>

{% for t in transactions %}

<tr>

<td>{{t.tx_date}}</td>

<td>{{t.tx_type}}</td>

<td>{{t.category}}</td>

<td>৳{{t.amount}}</td>

<td>

<form
method="post"
action="/finance/{{t.id}}/delete"
>

<button class="danger">
Delete
</button>

</form>

</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
