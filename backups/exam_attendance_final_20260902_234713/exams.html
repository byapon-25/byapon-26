{% extends "base.html" %}
{% block content %}

<h1>Exams & Marks</h1>

<div class="card">

<form method="post" class="grid">

<input
name="title"
placeholder="Exam Title"
required
>

<input
name="subject"
placeholder="Subject"
>

<input
type="date"
name="exam_date"
>

<input
name="full_marks"
type="number"
value="100"
placeholder="Full Marks"
>

<input
name="pass_marks"
type="number"
value="33"
placeholder="Pass Marks"
>

<button class="btn primary">
CREATE EXAM
</button>

</form>

</div>

<div class="card tablewrap">

<table>

<tr>
<th>Title</th>
<th>Subject</th>
<th>Date</th>
<th>Action</th>
</tr>

{% for e in exams %}

<tr>

<td>{{e.title}}</td>

<td>{{e.subject}}</td>

<td>{{e.exam_date}}</td>

<td class="actions">

<a
class="btn small"
href="/exams/{{e.id}}/marks"
>
Marks
</a>

<a
class="btn small"
href="/exams/{{e.id}}/edit"
>
Edit
</a>

<form
method="post"
action="/exams/{{e.id}}/delete"
>

<button class="danger">
Delete
</button>

</form>

</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
