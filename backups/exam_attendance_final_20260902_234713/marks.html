{% extends "base.html" %}
{% block content %}

<h1>{{exam.title}} — Marks Entry</h1>

<div class="card tablewrap">

<form method="post">

<table>

<tr>
<th>Student</th>
<th>Marks</th>
</tr>

{% for s in students %}

<tr>

<td>
{{s.name}} ({{s.student_id}})
</td>

<td>

<input
name="mark_{{s.id}}"
type="number"
step="0.01"
value="{{s.marks}}"
>

</td>

</tr>

{% endfor %}

</table>

<br>

<button class="btn primary">
SAVE MARKS
</button>

</form>

</div>

{% endblock %}
