{% extends "base.html" %}
{% block content %}
<div class="premium-edit-page">
<h2>Edit Transaction</h2>
<form method="POST">
<label>Date</label><input type="date" name="tx_date" value="{{ transaction['tx_date'] }}" required>
<label>Type</label>
<select name="tx_type" required>
<option value="Income" {% if transaction['tx_type']=='Income' %}selected{% endif %}>Income</option>
<option value="Expense" {% if transaction['tx_type']=='Expense' %}selected{% endif %}>Expense</option>
</select>
<label>Category</label><input type="text" name="category" value="{{ transaction['category'] or '' }}">
<label>Amount</label><input type="number" step="0.01" name="amount" value="{{ transaction['amount'] }}" required>
<label>Note</label><textarea name="note">{{ transaction['note'] or '' }}</textarea>
<button type="submit">SAVE CHANGES</button>
<a href="/finance">CANCEL</a>
</form>
</div>
{% endblock %}
