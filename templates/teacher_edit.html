{% extends "base.html" %}
{% block content %}

<h1>Edit Teacher</h1>

<div class="card">

<form method="post" class="grid">

<input
name="name"
value="{{teacher.name}}"
required
>

<input
name="phone"
value="{{teacher.phone or ''}}"
>

<input
name="subject"
value="{{teacher.subject or ''}}"
>

<input
name="salary"
type="number"
value="{{teacher.salary}}"
>

<button class="btn primary">
SAVE CHANGES
</button>

<div class="form-group">
    <label>Username</label>
    <input type="text" name="username" value="{{ teacher['name'] if false else '' }}" autocomplete="username">
</div>

<div class="form-group">
    <label>Password</label>
    <input type="password" name="password" placeholder="Leave blank to keep current password" autocomplete="new-password">
</div>

</form>

</div>

{% endblock %}
