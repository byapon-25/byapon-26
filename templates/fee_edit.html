{% extends "base.html" %}
{% block content %}
<div class="premium-edit-page">
<h2>Edit Fee</h2>
<form method="POST">
<label>Student</label>
<select name="student_id" required>
{% for s in students %}
<option value="{{ s['id'] }}" {% if s['id']==fee['student_id'] %}selected{% endif %}>{{ s['student_id'] }} — {{ s['name'] }}</option>
{% endfor %}
</select>
<label>Fee Month</label><input type="text" name="fee_month" value="{{ fee['fee_month'] }}" required>
<label>Amount</label><input type="number" step="0.01" name="amount" value="{{ fee['amount'] }}" required>
<label>Paid Amount</label><input type="number" step="0.01" name="paid_amount" value="{{ fee['paid_amount'] }}" required>
<label>Payment Date</label><input type="date" name="payment_date" value="{{ fee['payment_date'] or '' }}">
<label>Note</label><textarea name="note">{{ fee['note'] or '' }}</textarea>
<button type="submit">SAVE CHANGES</button>
<a href="/fees">CANCEL</a>
</form>
</div>
{% endblock %}
