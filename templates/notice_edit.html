{% extends "base.html" %}
{% block content %}
<div class="premium-edit-page">
<h2>Edit Notice</h2>
<form method="POST">
<label>Title</label><input type="text" name="title" value="{{ notice['title'] }}" required>
<label>Message</label><textarea name="message" rows="7" required>{{ notice['message'] }}</textarea>
<button type="submit">SAVE CHANGES</button>
<a href="/notices">CANCEL</a>
</form>
</div>
{% endblock %}
